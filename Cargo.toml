[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The kernel driver is built separately (#8, #22), so plain `cargo build` and
# `cargo test` at the root leave it out. `--workspace` still includes it.
default-members = [
    "crates/palisade-core",
    "crates/palisade-fileid",
    "crates/palisade-policy",
    "crates/palisade-proto",
    "crates/palisade-agent",
    "crates/palisade-tray",
    "crates/palisade-server",
    "crates/palisade-console",
    "crates/palisade-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. CI checks the workspace on this exact version (the `msrv` job).
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jusso-dev/palisade"
authors = ["Palisade contributors"]
# Nothing is ready for crates.io yet.
publish = false

# The single source of every dependency version. Member crates must use
# `{ workspace = true }` only; `cargo xtask check-manifests` enforces this.
[workspace.dependencies]
# Workspace crates are added here, as `{ path = "crates/<name>" }`, when a
# crate first needs another. The allowed directions are enforced by
# `cargo xtask check-deps`.
palisade-core = { path = "crates/palisade-core", default-features = false }
palisade-fileid = { path = "crates/palisade-fileid" }
palisade-policy = { path = "crates/palisade-policy" }
#
# Third-party crates. Justify every new entry in the PR description.
axum = { version = "0.8.9", default-features = false }
boon = { version = "0.6.1" }
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "env", "error-context", "help", "usage"] }
# Benchmarks only (dev-dependency). 0.7 is the last release that builds on the
# 1.85 MSRV; the default plotting and parallel features are left out.
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "http2", "server-auto", "service", "tokio"] }
if-addrs = { version = "0.15.0", default-features = false }
libc = { version = "0.2.191", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
regex-automata = { version = "0.4.19", default-features = false, features = ["std", "syntax", "perf", "unicode", "meta", "nfa-pikevm", "hybrid"] }
regex-syntax = { version = "0.8.12", default-features = false, features = ["std", "unicode"] }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
socket2 = { version = "0.6.5", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
windows-service = { version = "0.8.1" }
yaml-rust2 = { version = "0.13.2", default-features = false }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Restriction lints. `clippy.toml` allows unwrap/expect inside tests.
unwrap_used = "deny"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Selected pedantic lints: silent numeric truncation is a classic parser bug.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"

[profile.dev]
overflow-checks = true

[profile.release]
lto = "thin"
codegen-units = 1
# ADR 0012: the agent unwinds, so a parser panic on one crafted file is caught
# and that file is treated as unknown, instead of crashing the service. Cargo
# applies `panic` to the whole profile; the no_std driver sets its own (#8).
panic = "unwind"
debug = "line-tables-only"
# Debug info goes to separate files (PDBs on Windows), which the release
# pipeline publishes as symbols (#22).
split-debuginfo = "packed"
strip = "none"

# Decision logic and the parsers of untrusted input keep overflow checks
# even in release builds.
[profile.release.package.palisade-policy]
overflow-checks = true

[profile.release.package.palisade-fileid]
overflow-checks = true

[profile.release.package.palisade-proto]
overflow-checks = true
