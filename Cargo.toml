[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# The kernel driver is built separately (#8, #22), so plain `cargo build` and
# `cargo test` at the root leave it out. `--workspace` still includes it.
default-members = [
    "crates/palisade-core",
    "crates/palisade-fileid",
    "crates/palisade-policy",
    "crates/palisade-proto",
    "crates/palisade-agent",
    "crates/palisade-tray",
    "crates/palisade-server",
    "crates/palisade-console",
    "crates/palisade-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. CI checks the workspace on this exact version (the `msrv` job).
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/jusso-dev/palisade"
authors = ["Palisade contributors"]
# Nothing is ready for crates.io yet.
publish = false

# The single source of every dependency version. Member crates must use
# `{ workspace = true }` only; `cargo xtask check-manifests` enforces this.
[workspace.dependencies]
# Workspace crates are added here, as `{ path = "crates/<name>" }`, when a
# crate first needs another. The allowed directions are enforced by
# `cargo xtask check-deps`.
palisade-core = { path = "crates/palisade-core", default-features = false }
palisade-fileid = { path = "crates/palisade-fileid" }
palisade-policy = { path = "crates/palisade-policy" }
palisade-proto = { path = "crates/palisade-proto" }
#
# Third-party crates. Justify every new entry in the PR description.
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] }
# Dev-dependency of palisade-policy only: counts heap allocations in the
# zero-allocation test (#42). It replaces the global allocator in that test
# binary only.
allocation-counter = { version = "0.8.1", default-features = false }
arc-swap = { version = "1.9.5", default-features = false }
axum = { version = "0.8.9", default-features = false }
boon = { version = "0.6.1" }
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "env", "error-context", "help", "usage"] }
# Benchmarks only (dev-dependency). 0.7 was chosen when the MSRV was 1.85;
# moving to a newer release is a separate change. The default plotting and
# parallel features are left out.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Benchmarks only (dev-dependency of palisade-policy): the percentile
# harness of the performance budget (#42). The default serialisation and
# sync features are left out.
hdrhistogram = { version = "7.6.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "http2", "server-auto", "service", "tokio"] }
if-addrs = { version = "0.15.0", default-features = false }
# Snapshot tests (dev-dependency only). Without default features, so no
# terminal-colour crates; `json` gives `assert_json_snapshot!`.
insta = { version = "1.49.0", default-features = false, features = ["json"] }
# Schedules (#38): civil time, IANA time zones from the bundled database
# only, so evaluation never reads the system.
jiff = { version = "1.0.3", default-features = false, features = ["std", "tzdb-bundle-always"] }
libc = { version = "0.2.191", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
# Raw DEFLATE for app package members (#53). `forbid(unsafe_code)`, no
# default features but `with-alloc` (a heap-allocated inflate state).
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
proc-macro2 = { version = "1.0.107", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
quick-xml = { version = "0.41.0", default-features = false }
# Test fixture generation only (dev-dependency): a seeded RNG for repeatable
# test keys.
rand_core = { version = "0.10.1", default-features = false }
regex-automata = { version = "0.4.19", default-features = false, features = ["std", "syntax", "perf", "unicode", "meta", "nfa-pikevm", "hybrid"] }
regex-syntax = { version = "0.8.12", default-features = false, features = ["std", "unicode"] }
ring = { version = "0.17.14", default-features = false, features = ["alloc"] }
# Test fixture generation only (dev-dependency): throwaway RSA keys and
# signatures for the generated test CA (#25). Not used by any shipped code.
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
self_cell = { version = "1.3.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
# Inline vectors on the policy decision path, so a decision does not
# allocate (#42).
smallvec = { version = "1.16.6", default-features = false, features = ["serde"] }
socket2 = { version = "0.6.5", default-features = false }
sqlx = { version = "0.9.1", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.6.11", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
windows-registry = { version = "0.6.1", default-features = false, features = ["std"] }
windows-service = { version = "0.8.1" }
# Windows API bindings for `palisade_fileid::win` (ADR 0003, ADR 0011). Each
# user enables only the API families it calls.
windows-sys = { version = "0.61.2", default-features = false }
windows-version = { version = "0.1.7", default-features = false }
yaml-rust2 = { version = "0.13.2", default-features = false }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
# ADR 0011: `deny`, not `forbid`, so the allowlisted FFI modules can relax it.
# Every other crate root forbids it, and `cargo xtask check-unsafe` checks both.
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Restriction lints. `clippy.toml` allows unwrap/expect inside tests.
unwrap_used = "deny"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Selected pedantic lints: silent numeric truncation is a classic parser bug.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
# Clippy applies these from MSRV 1.94 (let-chains, `is_multiple_of`,
# `as_chunks`). They are allowed until the existing code is rewritten for
# them in a follow-up under #19, after the parallel work in progress lands.
collapsible_if = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"

[profile.dev]
overflow-checks = true

[profile.release]
lto = "thin"
codegen-units = 1
# ADR 0012: the agent unwinds, so a parser panic on one crafted file is caught
# and that file is treated as unknown, instead of crashing the service. Cargo
# applies `panic` to the whole profile; the no_std driver sets its own (#8).
panic = "unwind"
debug = "line-tables-only"
# Debug info goes to separate files (PDBs on Windows), which the release
# pipeline publishes as symbols (#22).
split-debuginfo = "packed"
strip = "none"

# Decision logic and the parsers of untrusted input keep overflow checks
# even in release builds.
[profile.release.package.palisade-policy]
overflow-checks = true

[profile.release.package.palisade-fileid]
overflow-checks = true

[profile.release.package.palisade-proto]
overflow-checks = true
