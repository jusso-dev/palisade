
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[policy.palisade-agent]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-cli]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-console]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-core]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-driver]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-fileid]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-policy]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-proto]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-server]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.palisade-tray]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-run"

[policy.xtask]
criteria = "safe-to-run"
dev-criteria = "safe-to-run"

