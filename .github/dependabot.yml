# Weekly dependency updates, with minor and patch bumps grouped into one PR per
# ecosystem. Security updates are raised as soon as an advisory is published
# (enable "Dependabot security updates" in the repository settings).
# Every Dependabot PR runs the full CI, including cargo-deny, cargo-audit and
# cargo-vet. A Cargo bump fails cargo-vet until the new version is audited
# (`cargo vet certify`), covered by an imported audit, or its exemption is
# updated with a note (docs/dependencies.md).
# `labels` replaces Dependabot's default labels, which are not in
# .github/labels.yml and would be deleted by the label sync.
# The npm (console) and docker (server image) ecosystems are added when those
# directories exist: #136 and #126.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: ["area:security"]
    commit-message:
      prefix: "chore(deps)"

  # Each fuzz project is a separate workspace with its own Cargo.lock
  # (docs/testing.md#fuzzing).
  - package-ecosystem: cargo
    directory: /crates/palisade-fileid/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fuzz-cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: ["area:security"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /crates/palisade-proto/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fuzz-cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: ["area:security"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /crates/palisade-policy/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fuzz-cargo-minor-and-patch:
        update-types: [minor, patch]
    labels: ["area:security"]
    commit-message:
      prefix: "chore(deps)"

  # Bumps the pinned action SHAs and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    labels: ["area:infra"]
    commit-message:
      prefix: "chore(ci)"
