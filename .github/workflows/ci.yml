# Palisade CI. Runs on GitHub-hosted runners only; `runner-guard` enforces
# that for every workflow. Branch protection requires `ci-ok`, which passes
# when every other job passed, plus `PR title` from pr-title.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so PRs (including forks) cannot poison it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # palisade-core without `std` is what the no_std driver links against.
      - run: cargo clippy -p palisade-core -p palisade-driver --no-default-features --all-targets --locked -- -D warnings
      # The same, with the optional serde and JSON Schema support, which must also build without `std`.
      - run: cargo clippy -p palisade-core --no-default-features --features schema --all-targets --locked -- -D warnings

  # The whole workspace on every runner: Linux and the other desktop OS
  # (portable crates; the Windows-only crates build as stubs there), Windows
  # x64, and Windows ARM64 natively.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      # nextest does not run doctests.
      - run: cargo test --workspace --all-features --locked --doc
      - name: Test summary
        if: ${{ !cancelled() }}
        # bash on every runner, so "$LABEL" reads the environment on Windows too.
        shell: bash
        env:
          LABEL: ${{ matrix.os }}
        run: cargo xtask test-summary "$LABEL" target/nextest/ci/junit.xml

  # Line, function and region coverage of the same tests, instrumented by
  # cargo-llvm-cov, as a per-crate table on the job summary page. Reported,
  # not gated: a crate below its target only gets a warning (docs/testing.md).
  coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml includes llvm-tools-preview, which cargo-llvm-cov needs.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152,cargo-llvm-cov@0.9.2
      - run: >-
          cargo llvm-cov nextest --workspace --all-features --locked --profile ci
          --json --summary-only --output-path target/llvm-cov-summary.json
      - name: Coverage summary
        shell: bash
        env:
          LABEL: ${{ matrix.os }}
        run: cargo xtask coverage-summary "$LABEL" target/llvm-cov-summary.json

  # palisade-policy line coverage must not decrease (#25). Measures the
  # crate's tests at the PR's base commit and at the PR, in this one job, and
  # fails if the covered share of lines went down. On pushes to main there is
  # no base to compare with, so the step is skipped and the job passes.
  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit too, to measure it.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152,cargo-llvm-cov@0.9.2
      - name: Coverage must not decrease
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask coverage-gate --base "$BASE_SHA"

  # The generated fixture corpus (#25): built from Rust on Linux, its hashes
  # match testdata/golden/fixtures.txt, and the repository holds no
  # executable file that testdata/manifest.txt does not allow. The corpus's
  # own properties are checked by palisade-fileid's fixture_corpus tests in
  # the `test` job, on every OS.
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask check-testdata
      - run: cargo xtask golden

  # Every committed fuzz-workspace lockfile is current. A dependency change
  # in a crate a fuzz workspace builds leaves its lockfile stale; this finds
  # that in seconds, instead of after the fuzz job's setup.
  fuzz-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask check-fuzz-locks

  # Snapshot tests (insta, #25): every snapshot matches, and none is left
  # unreferenced. Snapshots are reviewed in the PR like code.
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-insta@1.49.0
      # cargo-insta has no --locked. Fetch exactly Cargo.lock first (fails if
      # it is out of date), then run offline, so the run can neither
      # re-resolve the lockfile nor download anything.
      - run: cargo fetch --locked
      - env:
          CARGO_NET_OFFLINE: "true"
        run: >-
          cargo insta test --check --unreferenced reject --all-features
          -p palisade-policy -p palisade-proto

  # Every cargo-fuzz target, seeded from the synthetic test fixtures, for 60 s
  # each. A finding fails the job and is written to the job summary with a
  # reproducer. fuzz.yml runs the same targets for longer every week.
  # The targets are split across parallel shards (`--shard I/N` takes every
  # N-th target), so adding one does not push a single job towards its time
  # limit. The shard count is the length of the matrix and the N below; a
  # test in xtask/src/fuzz.rs fails when a shard has too many targets.
  fuzz:
    # A stale lockfile fails `fuzz-locks` in seconds; do not spend the fuzz
    # job's setup on it as well.
    needs: fuzz-locks
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # libFuzzer needs nightly. Keep in step with TOOLCHAIN in xtask/src/fuzz.rs.
      - run: rustup toolchain install nightly-2026-11-20 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
          # The action has no prebuilt cargo-fuzz. Build it from crates.io
          # with `cargo install --locked`, which needs no token.
          fallback: cargo-install
      # `I/N`: this job's shard, out of the matrix's length.
      - env:
          SHARD: ${{ matrix.shard }}/6
        run: cargo xtask fuzz --shard "$SHARD"

  # The criterion benchmarks build, and each runs once in test mode. Timings
  # are not measured here: shared hosted runners are too noisy to compare.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Name every bench target, so only the benches run (`--benches` would
      # rerun the library tests). A test in xtask/src/ci.rs keeps the list complete.
      - run: >-
          cargo test --workspace --all-features --locked
          --bench criterion_eval --bench hash_and_parse --bench simulate

  # The database tests (#127) against a real Postgres, as a service
  # container on the hosted runner. The image is the official one, pinned
  # by digest. The password only exists inside this throwaway container,
  # which listens on the runner's loopback only. Other jobs skip these tests,
  # because PALISADE_TEST_DATABASE_ADMIN_URL is not set there.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # postgres:17.12
        image: postgres@sha256:156d40cfa063d6babb15d329a8e15b26a8d0690ebb6084c956084f3b025c3b30
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PALISADE_TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo nextest run -p palisade-server --test postgres --locked --profile ci
      - name: Test summary
        if: ${{ !cancelled() }}
        run: cargo xtask test-summary postgres target/nextest/ci/junit.xml

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep in step with `rust-version` in the root Cargo.toml.
      MSRV: "1.94.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the MSRV matches Cargo.toml
        run: grep -Fx "rust-version = \"${MSRV%.0}\"" Cargo.toml
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked

  # The documentation site (#27, docs/ci.md#documentation-site): generated
  # pages up to date, every page in the book and accessible, then the book
  # built with every warning an error, every Mermaid diagram rendered, and
  # every internal link and anchor checked. External links are checked
  # weekly by links.yml, so a third-party outage never fails a PR.
  docs-book:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: mdbook@0.5.2,mdbook-mermaid-ssr@0.3.0
      - name: Install lychee (checksum-verified release)
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo xtask docs check
      - run: cargo xtask docs build

  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: typos@1.52.2
      # The accepted words are in _typos.toml.
      - run: typos

  # No commercial vendor or product names in any file or path (docs/NAMING.md).
  banned-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask check-banned-terms

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0,cargo-audit@0.23.0
      - run: cargo xtask check-deps
      - run: cargo xtask check-manifests
      - run: cargo xtask check-unsafe
      - run: cargo deny --locked check
      # Each fuzz project is a separate workspace with its own lockfile,
      # checked against the same deny.toml. A test in xtask/src/fuzz.rs keeps
      # this in step with the fuzz projects.
      - run: >-
          cargo deny --locked --manifest-path crates/palisade-fileid/fuzz/Cargo.toml
          --config deny.toml check
      - run: >-
          cargo deny --locked --manifest-path crates/palisade-proto/fuzz/Cargo.toml
          --config deny.toml check
      - run: >-
          cargo deny --locked --manifest-path crates/palisade-policy/fuzz/Cargo.toml
          --config deny.toml check
      # The same advisory database, read by a second tool on every PR, with
      # the same ignores as deny.toml; the daily audit.yml catches advisories
      # published after a merge.
      - run: cargo xtask audit

  # cargo-vet audits, plus the rules cargo-deny and cargo-vet do not check
  # themselves (duplicate budget, ignore expiry, criteria per crate). On every
  # pull request run, the dependency report goes to the job summary.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base commit too, to compare the dependency report against.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-vet@0.10.3
      - run: cargo vet --locked
      - run: cargo xtask check-supply-chain
      # On a PR that changes Cargo.lock, the job summary shows the dependency
      # report, `cargo tree -d`, and the change in third-party `unsafe` counts
      # against the base branch, with a warning for big jumps. It is a job
      # summary rather than a PR comment, so no job needs write access.
      - name: Dependency report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: cargo xtask deps-report --base "$BASE_SHA"

  # Every feature of the portable crates builds on its own, so no feature
  # silently depends on another being on (docs/workspace.md#feature-flags).
  feature-powerset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-hack@0.6.46
      - run: >-
          cargo hack check --each-feature --all-targets --locked
          -p palisade-core -p palisade-fileid -p palisade-policy
          -p palisade-proto -p palisade-server -p palisade-cli
          -p palisade-console -p palisade-agent

  runner-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask check-workflows
      - run: bash .github/scripts/main-snapshot.test.sh
      # ADR format, numbering, supersession links and index (docs/adr/PROCESS.md).
      - run: cargo xtask adr lint

  # The documentation checks that read the repository: the threat model's
  # tables and the tests, fuzz targets and CI checks it cites (#219).
  doc-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask threat-coverage

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified release)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zizmor@1.33.1
      - run: zizmor --offline .github/workflows

  # Release builds and the Windows Installer package for each architecture,
  # natively on its own runner (#22): the static-CRT binaries, their checks
  # (machine type, symbols, reproducible-build marker, version and
  # manifest), the symbols archive, the package with ICE validation, and an
  # install / upgrade / downgrade / repair / removal run of the package on
  # the runner. Nothing is uploaded here; on main, `snapshot` publishes.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `dist` builds for the runner's own architecture when no --target is given.
      - run: cargo xtask dist --msi --sign none --out target/dist/current
      # A second package, one patch version higher, to test upgrading.
      - run: cargo xtask dist --msi --bump-patch --out target/dist/next
      - name: Install, upgrade, downgrade, repair and remove
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: ./packaging/wix/smoke-test.ps1 -Current target/dist/current -Next target/dist/next -Arch $env:ARCH

  # Code signing, end to end, with throwaway certificates made on the runner
  # and deleted afterwards (#24): the packages built with every executable
  # and the package signed by a throwaway test CA, every signature verified
  # (including inside the packages); then the `pfx` path with a throwaway
  # PFX whose password is a canary, checked absent from the output; and a
  # signed package of unsigned executables, which verification must reject.
  # No secret of any kind is used.
  sign-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask dist --msi --sign test-ca --out target/dist/signed
      - name: Trust the throwaway test root on this runner
        shell: pwsh
        run: ./packaging/sign/sign.ps1 -Action trust
      - run: cargo xtask release verify target/dist/signed --allow-untimestamped
      - name: The pfx path, and rejecting unsigned executables
        shell: pwsh
        run: ./packaging/sign/ci-test.ps1 -UnsignedDir target/x86_64-pc-windows-msvc/release
      - name: Remove the test certificates
        if: always()
        shell: pwsh
        run: ./packaging/sign/sign.ps1 -Action cleanup

  # The Linux server binary, and its OCI image built with the runner's
  # preinstalled podman. The image is only built, not pushed; signing and
  # publishing it is #18.
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask dist --out target/dist/server
      - run: podman build --file packaging/server/Containerfile --tag palisade-server:ci target/dist/server
      - run: podman run --rm palisade-server:ci version

  # The single required check from this workflow for branch protection.
  ci-ok:
    if: always()
    needs: [fmt, clippy, test, postgres, coverage, coverage-gate, snapshots, fixtures, fuzz-locks, fuzz, bench, msrv, docs, docs-book, spelling, banned-terms, deps, supply-chain, feature-powerset, runner-guard, doc-checks, workflow-lint, package, sign-test, server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."

  # The rolling `main-snapshot` pre-release (#22): after every push to main
  # whose CI passed, the unsigned packages of that commit with their SHA-256
  # checksums. Only these three jobs can write (releases and the tag), and
  # they never run on pull requests. Each builds again instead of reusing
  # the `package` job's output, because no artefact action is allowed
  # (docs/ci.md#main-snapshot). CI runs on main are queued, never
  # concurrent (`concurrency` above), so two snapshots cannot interleave.
  snapshot-prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-snapshot.sh prepare

  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [snapshot-prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - run: cargo xtask dist --msi --sign none --out target/dist/snapshot
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: .github/scripts/main-snapshot.sh upload "$ARCH" target/dist/snapshot/Palisade-*.msi target/dist/snapshot/Palisade-*.msi.sha256

  snapshot-finish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [snapshot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/main-snapshot.sh finish
