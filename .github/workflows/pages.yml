# Publishes the documentation site (#27, docs/ci.md#publishing) to the
# `gh-pages` branch, which GitHub Pages serves (docs/repo-settings.md#github-pages).
# `main` is published as `latest/`, and each release tag vX.Y.Z as `vX.Y/`.
#
# The Pages deployment actions are not on the action allowlist, so this
# pushes the built site with git instead. The job builds from the commit
# that triggered it with read-only credentials; only the last step gets a
# token, and only to push the site directory to `gh-pages`.
name: Pages

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, in order, so two pushes cannot race on gh-pages.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  publish:
    # Only from main or a release tag. Pre-release tags (vX.Y.Z-rc.1) are
    # skipped; `version-for-ref` below rejects anything else.
    if: github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Only for the build request after the push (see the last step).
      pages: write
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      RUSTDOCFLAGS: -D warnings
      GIT_REF: ${{ github.ref }}
      REPOSITORY: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # No Rust cache: what is published is built from scratch, so a
      # poisoned cache cannot reach the site.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: mdbook@0.5.2,mdbook-mermaid-ssr@0.3.0
      - name: Install lychee (checksum-verified release)
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Fails on anything but main or a release tag vX.Y.Z, so a stray tag
      # never replaces a release's vX.Y/.
      - name: Choose the version directory
        run: |
          version=$(cargo xtask docs version-for-ref "$GIT_REF")
          echo "DOCS_VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo xtask docs check
      - run: cargo xtask docs build --site-url "/palisade/$DOCS_VERSION/"
      - run: cargo doc --workspace --no-deps --all-features --locked --lib
      - name: Assemble the site from the current gh-pages branch
        run: |
          site="$RUNNER_TEMP/site"
          if git ls-remote --exit-code --heads "https://github.com/$REPOSITORY.git" gh-pages > /dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "https://github.com/$REPOSITORY.git" "$site"
          else
            git init --quiet --initial-branch gh-pages "$site"
          fi
          cargo xtask docs assemble "$site" --version "$DOCS_VERSION"
      # The assembled tree adds the API docs and root files to the checked
      # book; check its own links before anything is pushed. rustdoc's
      # pages are its own and are not checked.
      - name: Check the assembled site's links
        run: >-
          lychee --offline --include-fragments --no-progress
          --exclude-path '404\.html$'
          --exclude-path 'api/rust/(src|static\.files|trait\.impl|type\.impl|palisade_)'
          "$RUNNER_TEMP/site/$DOCS_VERSION" "$RUNNER_TEMP/site/index.html"
      - name: Push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The site is unchanged."
            exit 0
          fi
          git commit --quiet -m "docs: publish $DOCS_VERSION from $SHA"
          # The token goes to this one push through git's environment
          # configuration, not the command line or the clone's config, and
          # its encoded form is masked in the log too.
          encoded=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$encoded"
          header="AUTHORIZATION: basic $encoded"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="$header" \
            git push "https://github.com/$REPOSITORY.git" HEAD:gh-pages
      # A push made with the workflow's `GITHUB_TOKEN` does not start a Pages
      # build, so ask for one. This builds from the configured source,
      # `gh-pages`, as a push by a person would, and needs only
      # `pages: write`. It runs even when the site was unchanged, so a rerun
      # after a failed request still publishes what an earlier run pushed;
      # an extra build of an unchanged branch is harmless.
      - name: Request the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$REPOSITORY/pages/builds" --jq .status
