# Weekly check of every external link in the documentation site (#27).
# Pull requests check internal links only (the `docs-book` job in ci.yml),
# so a third-party site being down never fails a PR. A broken external link
# opens a tracking issue, or comments on the open one.
name: External links

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: mdbook@0.5.2,mdbook-mermaid-ssr@0.3.0
      - name: Install lychee (checksum-verified release)
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: cargo xtask docs build
      # Every link, external ones included. Links to files in this
      # repository are checked offline already (xtask/src/docs/stage.rs
      # fails on one that does not exist), and are rate-limited when fetched.
      - run: >-
          lychee --no-progress --max-concurrency 8 --retry-wait-time 5 --max-retries 3
          --exclude-path '404\.html$'
          --exclude '^https://github\.com/jusso-dev/palisade/(blob|tree)/'
          target/book

  report:
    needs: links
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Documentation site has broken external links"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking issue
        run: |
          body="The weekly external link check failed. The run's log lists each broken link: $RUN_URL"
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=area:infra&per_page=100" \
            --jq '[.[] | select(.pull_request == null and .title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
            echo "Commented on #$number"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="$body" \
              -f 'labels[]=area:infra' --jq '"Opened #\(.number)"'
          fi
