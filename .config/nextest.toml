# cargo-nextest configuration. CI runs `cargo nextest run --profile ci`.
# Reference: https://nexte.st/docs/configuration/
# Conventions for tests themselves are in docs/testing.md.

[profile.default]
# Never retry: a test that passes only on a second try is a bug to fix, not
# to hide.
retries = 0
# Report a test as slow after 60 s. It still runs to the end; the slowest
# property tests take tens of seconds.
slow-timeout = "60s"

# Tests against a real Postgres (`palisade-server`'s `postgres` test binary,
# #127). Each test creates its own database and roles (per-test DB), so they
# may run in parallel; the group caps how many run at once, so the server's
# connection limit is never the reason a test fails. The other jobs run them
# too, where they skip themselves without PALISADE_TEST_DATABASE_ADMIN_URL.
[test-groups]
postgres = { max-threads = 4 }
diskpart = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(palisade-server) & binary(postgres)"
test-group = "postgres"

[profile.ci]
# Run every test even after a failure, so one run reports all of them.
fail-fast = false
retries = 0
slow-timeout = "60s"

[profile.ci.junit]
# Written to target/nextest/ci/junit.xml. `cargo xtask test-summary` turns it
# into the job summary and one annotation per failed test.
path = "junit.xml"

# The Windows SMB diagnostic test (#54) prints every raw OS answer for a
# file on a local share. Show that output even when it passes, so the CI
# log records how each runner image answers.
[[profile.ci.overrides]]
filter = "package(palisade-fileid) & test(smb_share_queries_are_reported)"
success-output = "immediate"

# The VHD tests in `palisade-fileid`'s `win_volume` binary run DiskPart,
# which must not run two scripts at once or within 15 s of each other
# (#54). nextest gives each test its own process, so this group runs them
# one at a time; each test also waits before its first script. Like the
# Postgres group, the `ci` profile inherits it from `default`.
[[profile.default.overrides]]
filter = "package(palisade-fileid) & binary(win_volume) & test(/vhd/)"
test-group = "diskpart"
