[package]
name = "palisade-server"
description = "Palisade central management server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "palisade-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["json", "matched-path", "tracing"] }
clap = { workspace = true }
hyper-util = { workspace = true }
if-addrs = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["catch-panic", "limit", "timeout", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "registry"] }
zeroize = { workspace = true }

[dev-dependencies]
ring = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
