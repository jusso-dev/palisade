[package]
name = "palisade-proto"
description = "Palisade agent-server wire types, event schema and schema versioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
palisade-core = { workspace = true, features = ["std", "schema"] }
# The security identifier parser, so SIDs read the same way in both crates.
palisade-fileid = { workspace = true }
# The strict YAML reader for the registry and mapping files.
palisade-policy = { workspace = true }
# Signatures and SHA-256 for the PKI module, behind its `crypto` module (ADR 0008).
ring = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
boon = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
