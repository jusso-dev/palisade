[package]
name = "palisade-proto"
description = "Palisade agent-server wire types, event schema and schema versioning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
palisade-core = { workspace = true, features = ["std", "schema"] }
# The security identifier parser, so SIDs read the same way in both crates.
palisade-fileid = { workspace = true }
# The strict YAML reader for the registry and mapping files.
palisade-policy = { workspace = true }
# Signatures and SHA-256 for the PKI module, behind its `crypto` module (ADR 0008).
ring = { workspace = true }
# X.509 encoding for the internal CA, only with the `issuance` feature.
rcgen = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Certificate times for `rcgen`, only with the `issuance` feature.
time = { workspace = true, optional = true }

[features]
# Certificate and CRL issuance for the internal CA (#224): the server and the
# offline ceremony tool enable it. The agent does not, so it never links the
# issuance code.
issuance = ["dep:rcgen", "dep:time"]

[dev-dependencies]
boon = { workspace = true }
insta = { workspace = true }
# Policy builders, to make bundles and deltas for the envelope tests.
palisade-policy = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
# Verifies issued chains and revocation lists with the TLS stack the server
# uses (rustls and its WebPKI verifier).
rustls = { workspace = true }

[lints]
workspace = true
