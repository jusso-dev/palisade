      Sha1CatalogHash: /native/catalog_sha1
      Sha256CatalogHash: /native/catalog_sha256
      UserWriteable: /file/user_writable_location
      OriginalFilename: /file/version_info/original_filename
      InternalName: /file/version_info/internal_name
      FileDescription: /file/version_info/description
      ProductName: /file/version_info/product_name
      FileVersion: /file/version_info/file_version
      PolicyName: /native/policy_name
      PolicyID: /native/policy_id
      PolicyGUID: /native/policy_guid
      System.UserID: /user/sid
      System.ProcessID: /process/pid
      FilePath: [/file/path, /script/path]
    signatures:
