      RuleSddlBuffer: /native/rule_sddl
      TargetUser: /user/sid
      TargetProcessId: /process/pid
      TargetLogonId: /user/logon_id
      FileHash: /native/rule_hash
      Fqbn: /native/fqbn
      FilePathBuffer: /file/path_normalised
      FullFilePathBuffer: /file/path
  - source_event_id: 8004
    when:
      field: PolicyNameBuffer
      equals: ["DLL"]
