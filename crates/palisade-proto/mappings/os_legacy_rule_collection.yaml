# OS legacy rule-collection logs -> canonical events (#196).
#
# These are the four rule-collection channels: `EXE and DLL`, `MSI and
# Script`, `Packaged app-Deployment` and `Packaged app-Execution`. The
# `MSI and Script` channel also carries the script, installer, COM and
# packaged-app events that the code integrity engine raises through script
# hosts (8028, 8029, 8036 to 8040).
#
# Field names are those of the provider's event templates; the decoder (#58,
# #90) flattens the record's user data into fields, renders binary fields as
# hex, and adds the record's system user and process as `System.UserID` and
# `System.ProcessID`.
#
# `FilePathBuffer` is the path with the engine's variables (such as
# `%SYSTEM32%`) and `FullFilePathBuffer` the full path. `FileHash` is the hash
# the engine uses for hash rules; its algorithm depends on the file type, so
# it goes to `native.rule_hash`, not to `file.hashes`.
#
# Not mapped yet (#58, #90): 8008, 8027, 8030 to 8035. 8038 is not an event
# of its own: it is read as the signature records of 8028 and 8029.
schema_version: 1.0.0
source: os_legacy_rule_collection
entries:
  # Policy: 8000, 8001.
  - source_event_id: 8000
    canonical_type: policy.failed
    action: apply
    outcome: failed
    description: "The rule-collection policy could not be converted and was not applied."
    field_map:
      Status: /native/status_code
  - source_event_id: 8001
    canonical_type: policy.applied
    action: apply
    outcome: info
    description: "The rule-collection policy was applied."
    field_map: {}
  # 8002: EXE and DLL. `PolicyNameBuffer` names the rule collection.
  - source_event_id: 8002
    when:
      field: PolicyNameBuffer
      equals: ["DLL"]
    canonical_type: library.decision
    action: load
    outcome: allowed
    description: "The rule-collection policy allowed a library."
    field_map:
      PolicyNameBuffer: /native/policy_name
      RuleId: /native/rule_guid
      RuleNameBuffer: /native/rule_name
      RuleSddlBuffer: /native/rule_sddl
      TargetUser: /user/sid
      TargetProcessId: /process/pid
      TargetLogonId: /user/logon_id
      FileHash: /native/rule_hash
      Fqbn: /native/fqbn
      FilePathBuffer: /file/path_normalised
      FullFilePathBuffer: /file/path
  - source_event_id: 8002
    canonical_type: exec.decision
    action: execute
    outcome: allowed
    description: "The rule-collection policy allowed an executable."
    field_map:
      PolicyNameBuffer: /native/policy_name
      RuleId: /native/rule_guid
      RuleNameBuffer: /native/rule_name
      RuleSddlBuffer: /native/rule_sddl
      TargetUser: /user/sid
      TargetProcessId: /process/pid
      TargetLogonId: /user/logon_id
      FileHash: /native/rule_hash
      Fqbn: /native/fqbn
      FilePathBuffer: /file/path_normalised
      FullFilePathBuffer: /file/path
  - source_event_id: 8003
    when:
      field: PolicyNameBuffer
      equals: ["DLL"]
    canonical_type: library.decision
    action: load
    outcome: audited
    mode: audit
    severity: 4
    description: "The rule-collection policy would have blocked a library."
    field_map:
      PolicyNameBuffer: /native/policy_name
      RuleId: /native/rule_guid
      RuleNameBuffer: /native/rule_name
      RuleSddlBuffer: /native/rule_sddl
      TargetUser: /user/sid
      TargetProcessId: /process/pid
      TargetLogonId: /user/logon_id
      FileHash: /native/rule_hash
      Fqbn: /native/fqbn
      FilePathBuffer: /file/path_normalised
      FullFilePathBuffer: /file/path
  - source_event_id: 8003
    canonical_type: exec.decision
    action: execute
    outcome: audited
    mode: audit
    severity: 4
    description: "The rule-collection policy would have blocked an executable."
    field_map:
