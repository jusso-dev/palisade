  # 8028, 8029, 8037: a script host or the installer asked the code integrity policy
  # about a file. For 8029 the host decides what happens next: a script host may run
  # the script with restrictions instead of not at all.
  - source_event_id: 8028
    when:
      field: FilePath
      ends_with: [".msi", ".msp", ".mst"]
    canonical_type: installer.decision
    action: install
    outcome: audited
    mode: audit
    severity: 4
    description: "The OS code integrity policy would have blocked an installer package."
    field_map:
      Sha1Hash: /file/hashes/authenticode_sha1
      Sha256Hash: /file/hashes/authenticode_sha256
      Sha1CatalogHash: /native/catalog_sha1
      Sha256CatalogHash: /native/catalog_sha256
      UserWriteable: /file/user_writable_location
      OriginalFilename: /file/version_info/original_filename
      InternalName: /file/version_info/internal_name
      FileDescription: /file/version_info/description
      ProductName: /file/version_info/product_name
      FileVersion: /file/version_info/file_version
      PolicyName: /native/policy_name
      PolicyID: /native/policy_id
      PolicyGUID: /native/policy_guid
      System.UserID: /user/sid
      System.ProcessID: /process/pid
      FilePath: /file/path
    signatures:
      source_event_id: 8038
      count_field: TotalSignatureCount
      index_field: Signature
      field_map:
        PublisherName: publisher
        IssuerName: issuer
        PublisherTBSHash: tbs_hash
        IssuerTBSHash: issuer_tbs_hash
  - source_event_id: 8028
    canonical_type: script.decision
