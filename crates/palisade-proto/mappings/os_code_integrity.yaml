# OS code integrity log -> canonical events (#196).
#
# Field names are those of the code integrity provider's event templates.
# Hashes are hex of the size the record declares (`*HashSize`). The decoder
# (#58, #90) renders binary fields as hex and adds the record's system user
# and process as `System.UserID` and `System.ProcessID`.
#
# For 3076/3077, `SHA1Hash` and `SHA256Hash` are the Authenticode (signed
# image) digests and the `*FlatHash` fields are digests of the whole file.
# The signing scenario tells kernel mode (0) from user mode (1). User-mode
# images are told apart by extension only, so a library with an unusual
# extension is reported as `exec.decision`; content-based classification is
# the collector's job (#58).
#
# Not mapped yet (#58, #90): 3001, 3002, 3004, 3010, 3011, 3012, 3024, 3026,
# 3032, 3036, 3064, 3065, 3074, 3075, 3079 to 3086, 3101, 3103, 3104, 3105,
# 3108, 3110, 3111, 3112. 3089 is not an event of its own: it is read as the
# signature records of a block or audit event.
#
# This file is hand-maintained data. The tests check every target against
# the event schema.
schema_version: 1.0.0
source: os_code_integrity
entries:
  # 3076: the main audit event.
  - source_event_id: 3076
    when:
      field: SISigningScenario
      equals: ["0"]
    canonical_type: driver.decision
    action: load
    outcome: audited
    mode: audit
    severity: 5
    description: "The OS code integrity policy would have blocked a kernel driver."
    field_map:
      FileName: /file/path
      ProcessName: /process/image_path
      RequestedSigningLevel: /native/requested_signing_level
      ValidatedSigningLevel: /native/validated_signing_level
      Status: /native/status_code
      SHA1Hash: /file/hashes/authenticode_sha1
      SHA256Hash: /file/hashes/authenticode_sha256
      SHA1FlatHash: /file/hashes/sha1
      SHA256FlatHash: /file/hashes/sha256
      SISigningScenario: /native/signing_scenario
      PolicyName: /native/policy_name
      PolicyID: /native/policy_id
      PolicyGUID: /native/policy_guid
      PolicyHash: /native/policy_hash
      OriginalFileName: /file/version_info/original_filename
      InternalName: /file/version_info/internal_name
      FileDescription: /file/version_info/description
      ProductName: /file/version_info/product_name
      FileVersion: /file/version_info/file_version
      UserWriteable: /file/user_writable_location
      PackageFamilyName: /file/package_name
      System.UserID: /user/sid
      System.ProcessID: /process/pid
    signatures:
      source_event_id: 3089
      count_field: TotalSignatureCount
      index_field: Signature
      field_map:
        PublisherName: publisher
        IssuerName: issuer
        PublisherTBSHash: tbs_hash
        IssuerTBSHash: issuer_tbs_hash
        SignatureType: signature_type
        ValidatedSigningLevel: signing_level
        VerificationError: verification_error
  - source_event_id: 3076
