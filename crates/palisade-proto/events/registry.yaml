# The event-type registry (#196): the source of truth for every canonical
# event type. `src/events/registry_gen.rs` and `REGISTRY.md` are generated
# from this file. After editing it, regenerate both with:
#
#   PALISADE_BLESS=1 cargo test -p palisade-proto --lib registry
#
# Each entry:
#   type         dotted name, lowercase: `<area>.<what>`
#   category     one of the envelope `category` values
#   severity     default severity, 0 to 10 (a mapping entry may override it)
#   required     the field sets every event of this type must carry
#   summarisable whether allowed events of this type may be summarised
#                instead of sent one by one (#197). Blocked and audited
#                events are never summarised.
#   since        the schema version that added the type; an event of this
#                type must have this `schema_version` or a newer one
#   description  one sentence, shown in the generated reference
#
# Adding a type is a minor schema change: it gets the new minor version as
# `since`, and `schema_version` below becomes that version. Removing a type,
# or changing an existing type's category or required field sets, is a
# major change. The test `released_types_are_unchanged` holds the 1.0 list.
schema_version: 1.2.0
types:
  - type: exec.decision
    category: execution
    severity: 3
    required: [file]
    summarisable: true
    since: 1.0.0
    description: An executable was allowed, blocked or audited.
  - type: library.decision
    category: library
    severity: 3
    required: [file]
    summarisable: true
    since: 1.0.0
    description: A library load into a process was allowed, blocked or audited.
  - type: driver.decision
    category: driver
    severity: 5
    required: [file]
    summarisable: true
    since: 1.0.0
    description: A kernel driver load was allowed, blocked or audited.
  - type: script.decision
    category: script
    severity: 3
    required: [script]
    summarisable: true
    since: 1.0.0
    description: A script was allowed, blocked or audited.
  - type: installer.decision
    category: installer
    severity: 3
    required: [file]
    summarisable: true
    since: 1.0.0
    description: An installer package was allowed, blocked or audited.
  - type: packaged_app.decision
    category: packaged_app
    severity: 3
    required: [file]
    summarisable: true
    since: 1.0.0
    description: A packaged app's installation or activation was allowed, blocked or audited.
  - type: com.decision
    category: execution
    severity: 3
    required: [native]
    summarisable: true
    since: 1.0.0
    description: A COM class activation was allowed, blocked or audited.
  - type: exec.origin_check
    category: execution
    severity: 1
    required: [file, native]
    summarisable: true
    since: 1.0.0
    description: The OS checked a file's managed-installer or reputation origin claims. Diagnostic only, not the final decision.
  - type: policy.applied
    category: policy
    severity: 2
    required: []
    summarisable: false
    since: 1.0.0
    description: A policy was applied, or was already current.
  - type: policy.failed
    category: policy
    severity: 7
    required: []
    summarisable: false
    since: 1.0.0
    description: A policy could not be applied or activated.
  - type: policy.activated
    category: policy
    severity: 2
    required: []
    summarisable: false
    since: 1.0.0
    description: A policy became active in the enforcement engine.
  - type: agent.started
    category: agent
    severity: 2
    required: []
    summarisable: false
    since: 1.0.0
    description: The agent started.
  - type: agent.stopped
    category: agent
    severity: 4
    required: []
    summarisable: false
    since: 1.0.0
    description: The agent stopped.
  - type: agent.health
    category: agent
    severity: 1
    required: [agent]
    summarisable: false
    since: 1.0.0
    description: A periodic report of the agent's health and counters.
  - type: agent.tamper
    category: agent
    severity: 9
    required: []
    summarisable: false
    since: 1.0.0
    description: An attempt to tamper with the agent, its configuration or its data was detected.
  - type: agent.throttled
    category: agent
    severity: 5
    required: [agent]
    summarisable: false
    since: 1.0.0
    description: The agent throttled events because of their rate.
  - type: agent.dropped
    category: agent
    severity: 7
    required: [agent]
    summarisable: false
    since: 1.0.0
    description: The agent dropped events, and reports how many.
  - type: agent.clock_unsynced
    category: agent
    severity: 5
    required: []
    summarisable: false
    since: 1.0.0
    description: The agent's wall clock is not synchronised, so event times may be wrong.
  - type: process.created
    category: execution
    severity: 2
    required: [process]
    summarisable: false
    since: 1.1.0
    description: The OS reported a new process, with its command line where collected (ISM-1889).
  - type: script.block_logged
    category: script
    severity: 2
    required: [script]
    summarisable: false
    since: 1.1.0
    description: The script interpreter logged the text of a script block it ran (ISM-1623).
  - type: script.language_audit
    category: script
    severity: 4
    required: [restriction]
    summarisable: false
    since: 1.1.0
    description: The script interpreter reported a restriction it would apply in constrained language mode.
  - type: containment.decision
    category: containment
    severity: 4
    required: [process]
    summarisable: true
    since: 1.1.0
    description: A contained application's access to a file, registry key, process or the network was allowed, blocked or audited.
  - type: device.attached
    category: device
    severity: 2
    required: [device]
    summarisable: false
    since: 1.1.0
    description: A peripheral device was connected.
  - type: device.detached
    category: device
    severity: 1
    required: [device]
    summarisable: false
    since: 1.1.0
    description: A peripheral device was disconnected.
  - type: storage.decision
    category: device
    severity: 4
    required: [device]
    summarisable: true
    since: 1.1.0
    description: Access to a removable or external storage device was allowed, blocked, made read-only or audited.
  - type: network.app.decision
    category: network
    severity: 3
    required: [network]
    summarisable: true
    since: 1.1.0
    description: An application's network connection was allowed, blocked or audited.
  - type: network.host.decision
    category: network
    severity: 3
    required: [network]
    summarisable: true
    since: 1.1.0
    description: A connection to or from the device was allowed, blocked or audited by host network control.
  - type: web.decision
    category: web
    severity: 3
    required: [network]
    summarisable: true
    since: 1.1.0
    description: Access to a web address was allowed, blocked or audited.
  - type: elevation.requested
    category: elevation
    severity: 4
    required: [elevation]
    summarisable: false
    since: 1.1.0
    description: A user asked to run something with elevated rights.
  - type: elevation.decision
    category: elevation
    severity: 5
    required: [elevation]
    summarisable: false
    since: 1.1.0
    description: Elevated rights were granted, refused or cancelled.
  - type: elevation.ended
    category: elevation
    severity: 3
    required: [elevation]
    summarisable: false
    since: 1.1.0
    description: An elevation grant ended or expired.
  - type: approval.requested
    category: approval
    severity: 3
    required: [approval]
    summarisable: false
    since: 1.1.0
    description: A user asked for an approval.
  - type: approval.decided
    category: approval
    severity: 4
    required: [approval]
    summarisable: false
    since: 1.1.0
    description: An approval request was approved, denied, expired or cancelled.
  - type: exception.created
    category: exception
    severity: 5
    required: [admin]
    summarisable: false
    since: 1.1.0
    description: A policy exception was created.
  - type: exception.changed
    category: exception
    severity: 5
    required: [admin]
    summarisable: false
    since: 1.1.0
    description: A policy exception was changed.
  - type: exception.removed
    category: exception
    severity: 4
    required: [admin]
    summarisable: false
    since: 1.1.0
    description: A policy exception was removed.
  - type: exception.expired
    category: exception
    severity: 3
    required: []
    summarisable: false
    since: 1.1.0
    description: A policy exception reached its end date.
  - type: otp.session.started
    category: exception
    severity: 7
    required: [approval]
    summarisable: false
    since: 1.1.0
    description: An offline override code started a session in which the policy is relaxed.
  - type: otp.session.ended
    category: exception
    severity: 4
    required: [approval]
    summarisable: false
    since: 1.1.0
    description: An offline override session ended.
  - type: admin.action
    category: admin_audit
    severity: 4
    required: [admin]
    summarisable: false
    since: 1.1.0
    description: An administrator, API client or job changed something on the server.
  - type: admin.login
    category: admin_audit
    severity: 2
    required: [admin]
    summarisable: false
    since: 1.1.0
    description: A person or client signed in to the server.
  - type: admin.login_failed
    category: admin_audit
    severity: 5
    required: [admin]
    summarisable: false
    since: 1.1.0
    description: A sign-in to the server failed.
  - type: identity.logon
    category: identity
    severity: 2
    required: [user]
    summarisable: false
    since: 1.1.0
    description: An account logged on to the device.
  - type: identity.logon_failed
    category: identity
    severity: 5
    required: [user]
    summarisable: false
    since: 1.1.0
    description: A logon to the device failed.
  - type: identity.local_group.changed
    category: identity
    severity: 6
    required: [identity]
    summarisable: false
    since: 1.1.0
    description: A member was added to or removed from a security group (ISM-1650).
  - type: identity.group.changed
    category: identity
    severity: 6
    required: [identity]
    summarisable: false
    since: 1.1.0
    description: A member was added to or removed from a directory global or universal security group (ISM-1650).
  - type: detection.log_cleared
    category: detection
    severity: 9
    required: []
    summarisable: false
    since: 1.1.0
    description: An event log was cleared.
  - type: detection.audit_policy_changed
    category: detection
    severity: 7
    required: [audit_policy]
    summarisable: false
    since: 1.1.0
    description: The OS audit policy was changed.
  - type: integrity.fim.changed
    category: integrity
    severity: 5
    required: [file, fim]
    summarisable: false
    since: 1.1.0
    description: A monitored file was created, changed, renamed or deleted.
  - type: compliance.probe.result
    category: compliance
    severity: 3
    required: [probe]
    summarisable: false
    since: 1.1.0
    description: A compliance probe reported its result.
  - type: policy.signature.invalid
    category: policy
    severity: 8
    required: [policy]
    summarisable: false
    since: 1.2.0
    description: A policy bundle had no valid signature from a trusted policy-signing key. It was rejected, or loaded only because the signature mode is audit or warn.
  - type: policy.rollback_rejected
    category: policy
    severity: 8
    required: [policy]
    summarisable: false
    since: 1.2.0
    description: A policy bundle was rejected because its version is below the highest version this device has accepted for its target.
  - type: policy.target_mismatch
    category: policy
    severity: 7
    required: [policy]
    summarisable: false
    since: 1.2.0
    description: A policy bundle was rejected because its tenant or target does not match this device's enrolment.
  - type: policy.stale
    category: policy
    severity: 5
    required: [policy]
    summarisable: false
    since: 1.2.0
    description: No newer policy arrived within the staleness window, or the policy is past its expiry. The device keeps enforcing it.
  - type: policy.lkg_loaded
    category: policy
    severity: 9
    required: [policy]
    summarisable: false
    since: 1.2.0
    description: The active policy failed its integrity check at load, so the previous policy it directly replaced was loaded instead.
  - type: policy.emergency_loaded
    category: policy
    severity: 9
    required: []
    summarisable: false
    since: 1.2.0
    description: No cached policy could be loaded after a policy had been accepted, so the built-in emergency policy was loaded.
  - type: policy.schema_unsupported
    category: policy
    severity: 6
    required: [policy]
    summarisable: false
    since: 1.2.0
    description: A policy bundle uses a schema this agent does not support. It was rejected and the last known good policy stays in force.
  - type: tamper.policy.rollback_suspected
    category: agent
    severity: 9
    required: []
    summarisable: false
    since: 1.2.0
    description: The copies of the policy anti-rollback record disagree, one is missing or corrupt, or no cached policy meets the recorded version.
