# A global mandatory blocklist, a tenant allowlist, a group that suppresses
# one inherited allow and locks the mode, and a device with its own allow.
# Dynamic group membership adds a rule set and a setting.
description: >-
  Rules are additive across levels with provenance; an allowlist rule is
  suppressed below the group; a mandatory blocklist cannot be suppressed and
  still blocks; settings are override-by-nearest with a lock; the locked
  enforce mode raises a weaker device mode and a type mode.
