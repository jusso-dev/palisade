# Numeric, level, date, network, set and time operators on context
# fields (#32, #33).

[[case]]
name = "numeric between"
criterion = { field = "device.os_build", operator = "between", values = ["22000", "22999"] }
context = { "device.os_build" = 22631 }
expect = "match"

[[case]]
name = "numeric ne needs every value different"
criterion = { field = "session.id", operator = "ne", values = ["0", "1"] }
context = { "session.id" = 1 }
expect = "no_match"

[[case]]
name = "numeric eq"
criterion = { field = "device.os_build", operator = "eq", values = ["19045", "22631"] }
context = { "device.os_build" = 22631 }
expect = "match"

[[case]]
name = "numeric gt, at the bound"
criterion = { field = "device.os_build", operator = "gt", values = ["22631"] }
context = { "device.os_build" = 22631 }
expect = "no_match"

[[case]]
name = "numeric gt, above the bound"
criterion = { field = "device.os_build", operator = "gt", values = ["22630"] }
context = { "device.os_build" = 22631 }
expect = "match"

[[case]]
name = "numeric le, at the bound"
criterion = { field = "device.os_build", operator = "le", values = ["22631"] }
context = { "device.os_build" = 22631 }
expect = "match"

[[case]]
name = "numeric le, below the fact"
criterion = { field = "device.os_build", operator = "le", values = ["22630"] }
context = { "device.os_build" = 22631 }
expect = "no_match"

[[case]]
name = "numeric lt, at the bound"
criterion = { field = "session.id", operator = "lt", values = ["1"] }
context = { "session.id" = 1 }
expect = "no_match"

[[case]]
name = "numeric on an unknown fact"
criterion = { field = "device.os_build", operator = "ge", values = ["1"] }
expect = "unknown"

[[case]]
name = "integrity level is ordered"
criterion = { field = "user.integrity_level", operator = "lt", values = ["high"] }
context = { "user.integrity_level" = "medium_plus" }
expect = "match"

[[case]]
name = "date between includes both ends"
criterion = { field = "time.date", operator = "date_between", values = ["2026-11-01", "2026-11-25"] }
context = { "time.date" = "2026-11-25" }
expect = "match"

[[case]]
name = "CIDR v4"
criterion = { field = "session.client_ip", operator = "ip_in_cidr", values = ["192.168.0.0/16"] }
context = { "session.client_ip" = "192.168.4.4" }
expect = "match"

[[case]]
name = "CIDR v6"
criterion = { field = "net.ip", operator = "ip_in_cidr", values = ["2001:db8::/32"] }
context = { "net.ip" = ["10.0.0.1", "2001:db8:1::5"] }
expect = "match"

[[case]]
name = "IPv4-mapped IPv6 is IPv4"
criterion = { field = "session.client_ip", operator = "ip_in_cidr", values = ["10.0.0.0/8"] }
context = { "session.client_ip" = "::ffff:10.9.9.9" }
expect = "match"

[[case]]
name = "octet range"
criterion = { field = "session.client_ip", operator = "ip_between", values = ["192.168.1.10-20"] }
context = { "session.client_ip" = "192.168.1.21" }
expect = "no_match"

[[case]]
name = "octet wildcard"
criterion = { field = "net.ip", operator = "ip_wildcard", values = ["10.*.*.*"] }
context = { "net.ip" = ["172.16.0.1", "10.4.4.4"] }
expect = "match"

[[case]]
name = "CIDR with host bits is rejected"
criterion = { field = "net.ip", operator = "ip_in_cidr", values = ["10.1.2.3/8"] }
error = "invalid_value"

[[case]]
name = "all_of"
