[[case]]
name = "time window wraps midnight (late)"
criterion = { field = "time.local_time", operator = "time_between", values = ["22:00", "06:00"] }
context = { "time.minute" = 1430 }
expect = "match"

[[case]]
name = "time window wraps midnight (early)"
criterion = { field = "time.local_time", operator = "time_between", values = ["22:00", "06:00"] }
context = { "time.minute" = 359 }
expect = "match"

[[case]]
name = "time window excludes its end"
criterion = { field = "time.local_time", operator = "time_between", values = ["22:00", "06:00"] }
context = { "time.minute" = 360 }
