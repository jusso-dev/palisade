# Path normalisation and path matching (#32). Facts and values pass through
# the same normalisation, so alternate spellings are one object. These
# vectors are shared with the bypass regression suite (#18).

[[case]]
name = "extended-length prefix"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "\\\\?\\C:\\Tools\\a.exe"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "NT object prefix"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "\\??\\C:\\Tools\\a.exe"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "extended UNC is UNC"
criterion = { field = "path.full", operator = "starts_with", values = ["\\\\srv\\share"] }
path = "\\\\?\\UNC\\srv\\share\\a.exe"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "mixed separators, dot segments and repeated separators"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "C:/Tools//x/..\\.\\a.exe"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "case does not matter on paths"
criterion = { field = "path.full", operator = "equals", values = ["c:\\tools\\A.EXE"] }
path = "C:\\Tools\\a.exe"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "trailing dot is significant"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "C:\\Tools\\a.exe."
user_writable = false
volume = "fixed"
expect = "no_match"

[[case]]
name = "trailing space is significant"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "C:\\Tools\\a.exe "
user_writable = false
volume = "fixed"
expect = "no_match"

[[case]]
name = "starts_with ends at a component"
criterion = { field = "path.full", operator = "starts_with", values = ["C:\\Tools"] }
path = "C:\\ToolsX\\a.exe"
user_writable = false
volume = "fixed"
expect = "no_match"

[[case]]
name = "a stream is its own object"
criterion = { field = "path.full", operator = "wildcard", values = ["C:\\Tools\\*"] }
path = "C:\\Tools\\a.exe:payload"
user_writable = false
volume = "fixed"
expect = "no_match"

[[case]]
name = "match_ads lets the file's value match its streams"
criterion = { field = "path.full", operator = "wildcard", values = ["C:\\Tools\\*"], match_ads = true }
path = "C:\\Tools\\a.exe:payload"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "match_ads is not allowed on a negation"
criterion = { field = "path.full", operator = "not_wildcard", values = ["C:\\Tools\\*"], match_ads = true }
error = "option_not_applicable"

[[case]]
name = "double star crosses components"
criterion = { field = "path.full", operator = "wildcard", values = ["C:\\Program Files\\**\\*.exe"] }
path = "C:\\Program Files\\App\\bin\\x64\\app.exe"
user_writable = false
volume = "fixed"
expect = "match"

[[case]]
name = "single star stays in one component"
criterion = { field = "path.full", operator = "wildcard", values = ["C:\\Program Files\\*.exe"] }
path = "C:\\Program Files\\App\\app.exe"
user_writable = false
volume = "fixed"
expect = "no_match"

[[case]]
name = "allow does not trust a user-writable path"
criterion = { field = "path.full", operator = "starts_with", values = ["C:\\Tools"] }
path = "C:\\Tools\\a.exe"
user_writable = true
action = "allow"
expect = "unknown"

[[case]]
name = "allow does not trust a path whose permissions are unknown"
criterion = { field = "path.full", operator = "starts_with", values = ["C:\\Tools"] }
path = "C:\\Tools\\a.exe"
action = "allow"
expect = "unknown"

[[case]]
name = "allow trusts an admin-only path"
criterion = { field = "path.full", operator = "starts_with", values = ["C:\\Tools"] }
path = "C:\\Tools\\a.exe"
user_writable = false
volume = "fixed"
action = "allow"
expect = "match"

[[case]]
name = "an unmapped device path is unknown"
criterion = { field = "path.full", operator = "not_equals", values = ["C:\\Tools\\a.exe"] }
path = "\\Device\\HarddiskVolume9\\Tools\\a.exe"
user_writable = false
volume = "fixed"
expect = "unknown"

[[case]]
name = "a relative value is rejected"
criterion = { field = "path.full", operator = "equals", values = ["Tools\\a.exe"] }
error = "invalid_value"

# #328: a path is only an identity for an allow on a fixed local volume
# whose ACL is proven. Removable, optical and network volumes, or an
# unknown kind, prove nothing whatever their ACL says.

[[case]]
name = "an allow trusts a proven ACL on a fixed volume"
criterion = { field = "path.directory", operator = "equals", values = ['C:\Tools'] }
path = 'C:\Tools\a.exe'
user_writable = false
volume = "fixed"
action = "allow"
expect = "match"

[[case]]
name = "an allow does not trust a path on a removable volume"
criterion = { field = "path.directory", operator = "equals", values = ['E:\Tools'] }
path = 'E:\Tools\a.exe'
user_writable = false
volume = "removable"
action = "allow"
expect = "unknown"

[[case]]
name = "an allow does not trust a path on a network volume"
criterion = { field = "path.directory", operator = "equals", values = ['Z:\Tools'] }
path = 'Z:\Tools\a.exe'
user_writable = false
volume = "network"
action = "allow"
expect = "unknown"

[[case]]
name = "an allow does not trust a path on an optical volume"
criterion = { field = "path.full", operator = "equals", values = ['D:\setup.exe'] }
path = 'D:\setup.exe'
user_writable = false
volume = "optical"
action = "allow"
expect = "unknown"

[[case]]
name = "an allow does not trust a path whose volume is unknown"
criterion = { field = "path.directory", operator = "equals", values = ['C:\Tools'] }
path = 'C:\Tools\a.exe'
user_writable = false
action = "allow"
expect = "unknown"

[[case]]
name = "a deny on a removable volume still matches"
criterion = { field = "path.directory", operator = "equals", values = ['E:\Tools'] }
path = 'E:\Tools\a.exe'
volume = "removable"
action = "deny"
expect = "match"

# Names in a path fold with the NTFS upcase table, and with no NFC (#399).

[[case]]
name = "the long s is not an S on NTFS"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\SETUP.EXE"] }
path = "C:\\Tools\\\u017Fetup.exe"
expect = "no_match"

[[case]]
name = "the dotless i is not an I on NTFS"
criterion = { field = "path.file_name", operator = "equals", values = ["DIG.EXE"] }
path = "C:\\Tools\\d\u0131g.exe"
expect = "no_match"

[[case]]
name = "Greek with a combining iota folds on NTFS"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\\u1F80.exe"] }
path = "C:\\Tools\\\u1F88.EXE"
expect = "match"

[[case]]
name = "NFC and NFD spellings are two names"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Caf\u00E9\\a.exe"] }
path = "C:\\Cafe\u0301\\a.exe"
expect = "no_match"

[[case]]
name = "a value is read in NFC"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Cafe\u0301\\a.exe"] }
path = "C:\\Caf\u00E9\\a.exe"
expect = "match"

# A volume whose case folding is not known, such as any network share
# (#399): a path test is unknown whenever its result would relax its rule.

[[case]]
name = "unknown fold: a deny that misses by key is unknown"
criterion = { field = "path.full", operator = "equals", values = ["\\\\srv\\share\\setup.exe"] }
path = "\\\\srv\\share\\\u017Fetup.exe"
fold_unknown = true
expect = "unknown"

[[case]]
name = "unknown fold: a deny that matches by key matches"
criterion = { field = "path.full", operator = "equals", values = ["\\\\srv\\share\\setup.exe"] }
path = "\\\\srv\\share\\SETUP.EXE"
fold_unknown = true
expect = "match"

[[case]]
name = "unknown fold: a negated deny test that matches by key is unknown"
criterion = { field = "path.full", operator = "not_wildcard", values = ["\\\\srv\\share\\**"] }
path = "\\\\srv\\share\\a.exe"
fold_unknown = true
expect = "unknown"

[[case]]
name = "unknown fold: an allow never matches"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "C:\\Tools\\a.exe"
user_writable = false
volume = "fixed"
fold_unknown = true
action = "allow"
expect = "unknown"

[[case]]
name = "unknown fold: an allow that misses is still a miss"
criterion = { field = "path.full", operator = "equals", values = ["C:\\Tools\\a.exe"] }
path = "C:\\Tools\\b.exe"
user_writable = false
volume = "fixed"
fold_unknown = true
action = "allow"
expect = "no_match"
