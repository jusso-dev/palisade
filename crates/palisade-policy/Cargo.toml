[package]
name = "palisade-policy"
description = "Palisade policy model and pure, deterministic rule evaluation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Builders for policies, rules, facts and contexts, for tests in this and
# other crates (`palisade_policy::test_util`). Only dev-dependencies turn it
# on, so it never reaches a release build.
test-util = []

[dependencies]
# Keyed digests of withheld facts in decision traces (#41).
hmac = { workspace = true }
jiff = { workspace = true }
palisade-core = { workspace = true, features = ["std", "schema"] }
arc-swap = { workspace = true }
regex-automata = { workspace = true }
regex-syntax = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
self_cell = { workspace = true }
# SHA-256 of the effective policy's canonical form (#37), trace IDs from event
# IDs, and the digest of withheld facts (#41).
sha2 = { workspace = true }
smallvec = { workspace = true }
unicode-normalization = { workspace = true }
yaml-rust2 = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
boon = { workspace = true }
criterion = { workspace = true }
hdrhistogram = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
toml = { workspace = true }

[[test]]
name = "decision_snapshots"
required-features = ["test-util"]

[[test]]
name = "signer_criteria"
required-features = ["test-util"]

[[test]]
name = "publisher_product"
required-features = ["test-util"]

[[test]]
name = "bundle_golden"
required-features = ["test-util"]

[[bench]]
name = "criterion_eval"
harness = false

[[bench]]
name = "simulate"
harness = false

[[bench]]
name = "policy_eval"
harness = false

[lints]
workspace = true
