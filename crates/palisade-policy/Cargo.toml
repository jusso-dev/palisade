[package]
name = "palisade-policy"
description = "Palisade policy model and pure, deterministic rule evaluation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
palisade-core = { workspace = true, features = ["std", "schema"] }
regex-automata = { workspace = true }
regex-syntax = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 of the effective policy's canonical form (#37). Already used by palisade-fileid.
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
