[package]
name = "palisade-cli"
description = "The `pal` command-line tool for Palisade."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "pal"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
palisade-fileid = { workspace = true }
serde_json = { workspace = true }

# `O_NONBLOCK`, so `pal fileid certs` cannot block on a FIFO.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# On Windows, the OS-backed reads: the final path and the mark-of-the-web.
[target.'cfg(windows)'.dependencies]
palisade-fileid = { workspace = true, features = ["os-trust"] }

[dev-dependencies]
# Builds the identity corpus of `palisade-fileid` at test time (its test CA
# keys and signatures; `tests/fileid.rs`).
rand_core = { workspace = true }
ring = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# Parses `--yaml` output back in the tests.
yaml-rust2 = { workspace = true }

[lints]
workspace = true
