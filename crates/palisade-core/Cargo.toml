[package]
name = "palisade-core"
description = "Shared Palisade types with no I/O; no_std compatible."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Standard library support. Off for `no_std` users such as the driver.
std = []
# serde (de)serialisation of the shared types. Works without `std`.
serde = ["dep:serde"]
# JSON Schema descriptions of the shared types, for `palisade-policy`'s schema.
schema = ["serde", "dep:schemars"]
# In-memory mocks of the platform traits, and their contract checks. For
# tests and the agent's simulator only; never in a release build.
test-util = []

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
