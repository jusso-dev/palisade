[package]
name = "palisade-agent"
description = "Palisade Windows endpoint agent (service, event collection, enforcement glue)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "palisade-agent"
path = "src/main.rs"

[features]
# `--simulate`: the fake agent, built on the platform mocks in
# `palisade-core`'s `test-util`. For development builds only; never in a
# release build (#29).
test-util = [
    "palisade-core/test-util",
]

[dependencies]
# The platform traits (#29).
palisade-core = { workspace = true, features = ["std"] }
# SIDs for the identity backend, and signature verification and catalog
# lookups for the signature backend (#29).
palisade-fileid = { workspace = true }
# The event schema: the simulator's events, the process monitor's
# canonical process fields (#59) and the policy bundle decisions (#304).
palisade-proto = { workspace = true }
# Interface addresses for the environment backend, as in the server.
if-addrs = { workspace = true }
# The policy cache (#61): the bundle format and engine, the anti-rollback
# and last-known-good decisions, and the lock-free swap of the running
# policy (already in the agent's tree through `palisade-policy`).
arc-swap = { workspace = true }
# The policy cache (#61), and command-line redaction with the
# decision-trace redactor (#59).
palisade-policy = { workspace = true }
serde = { workspace = true }
# The event pipeline's hash chain (#63) and the simulator's event chain.
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Account names and the file-system context through `palisade_fileid::win`
# (ADR 0003: only the agent enables `os-trust`).
palisade-fileid = { workspace = true, features = ["os-trust"] }
# Safe registry reads, for the registry and environment backends (#29).
windows-registry = { workspace = true }
windows-service = { workspace = true }
# The running OS version, without `unsafe` in this crate.
windows-version = { workspace = true }
# Process, token, session and local-group queries, for `palisade_agent::ffi`
# only (ADR 0011).
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    # The primary connection type: the best route's interface row.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_Security",
    # Machine-scope DPAPI for the policy cache's data keys and
    # anti-rollback record copies (#326).
    "Win32_Security_Cryptography",
    # `MoveFileExW`, for the policy cache's durable rename (#61), and the
    # process monitor's drive-to-device map (#59).
    "Win32_Storage_FileSystem",
    # The process monitor's ETW session (#59).
    "Win32_System_Diagnostics_Etw",
    # The process monitor's startup snapshot (#59).
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    # `EVENT_TRACE_LOGFILEW` (#59).
    "Win32_System_Time",
] }

[dev-dependencies]
serde_json = { workspace = true }
# The facts bridge's property tests (`tests/facts.rs`).
proptest = { workspace = true }
palisade-core = { workspace = true, features = ["std", "test-util"] }
palisade-policy = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
