# Coverage-guided fuzz targets for the palisade-fileid parsers (cargo-fuzz,
# libFuzzer). This is a separate workspace, so the main build, tests and
# lint checks never compile it and nightly is needed only here.
#
#   cargo +nightly fuzz run pe_parse            # from crates/palisade-fileid
#   cargo +nightly fuzz run version_info_parse
#   cargo +nightly fuzz run authenticode_ranges
#   cargo +nightly fuzz run authenticode_pkcs7
#   cargo +nightly fuzz run fsctx_parse
#   cargo +nightly fuzz run x509_chain
[package]
name = "palisade-fileid-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
palisade-fileid = { path = ".." }

[[bin]]
name = "pe_parse"
path = "fuzz_targets/pe_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_info_parse"
path = "fuzz_targets/version_info_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authenticode_ranges"
path = "fuzz_targets/authenticode_ranges.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authenticode_pkcs7"
path = "fuzz_targets/authenticode_pkcs7.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fsctx_parse"
path = "fuzz_targets/fsctx_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "x509_chain"
path = "fuzz_targets/x509_chain.rs"
test = false
doc = false
bench = false
