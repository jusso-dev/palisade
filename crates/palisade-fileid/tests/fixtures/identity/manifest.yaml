- id: "powershell-in-place-nothing-trusted"
  file: "signed-powershell.exe"
  source: "generated"
  licence: "Apache-2.0 OR MIT"
  generator: "signed.rs"
  description: "The protected PowerShell host at its own path, with nothing trusted: whether its signer is the expected one cannot be told, so the relocation and impersonation checks are unassessed and nothing is reported. Unassessed is not clean (ADR 0018), and a hash rule would allow a renamed impostor, so no allow rule is recommended."
  context: "default"
  path_as: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
  expected:
    signing_state: "untrusted"
    masquerade_score: 0
    recommended_level: "none"

