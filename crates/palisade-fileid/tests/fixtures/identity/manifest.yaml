  generator: "C:\\Windows\\System32\\notepad.exe"
  description: "The file system context of an OS binary on the Windows runners (#54): a file with an ID on an NTFS volume, not a reparse point. The location, owner class and writability depend on the runner's disk and are checked for consistency by fs_context_on_windows_is_consistent. Read through the OS file system API, so only in builds with the os-trust feature."
  requires: "os-trust"
  expected:
    fs_has_file_id: true
    fs_file_system: "ntfs"
    fs_reparse: "none"

# Review regressions (#294): each must hold, or an allow rule is
# recommended for a file nothing vouches for.

- id: "driver-expired-catalog"
  file: "palisade.sys"
  source: "synthetic"
  licence: "Apache-2.0 OR MIT"
  generator: "driver"
  description: "The driver image, listed only in expired.cat, whose signer certificate (under the trusted corpus CA) was valid in 2020 only and which carries no timestamp: the catalog has expired, so it vouches for nothing."
  context: "trusted"
  expected:
    sha256: "3150d1d2908b2028e67876631cb24e2cd98bc8e7336f870c7e2b8bc283766152"
    signing_state: "untrusted"
    embedded: "unsigned"
    catalog: "listed_untrusted"
    catalog_matches: 1
    # A hash rule, as for any unsigned file: never a publisher rule.
    recommended_level: "authenticode_hash"

- id: "sha1-signed-tool"
  file: "sha1-signed-tool.exe"
  source: "generated"
  licence: "Apache-2.0 OR MIT"
  generator: "signed.rs"
  description: "The tool signed by the trusted corpus vendor with SHA-1 content and signer digests: a valid signature, but SHA-1 vouches for nothing (ADR 0008, ADR 0017), so it is not trusted and no publisher rule is recommended."
  context: "trusted"
  path_as: "extool.exe"
  expected:
    sha256: "4ebe79599344a87d83fbfe6f96eb7df2202496dd59652a47ed9f8e791a847185"
    sha1: "e9de2b8eb87fe7bc6af09e6918b355bc2a88a00e"
    md5: "1883aaa6dab04b1766df6dd595d8a41a"
    authenticode_sha256: "bb315a34a23b4cc8f185907f6954fc105c431ec15bf655180d25348cf58def5b"
    signing_state: "untrusted"
    embedded: "valid"
    signatures: 1
    # Not trusted, so its "Example Org" company name is not backed by the
    # vendor's signer: an impersonation, and no rule.
    masquerade_reasons: ["signer_impersonation"]
    recommended_level: "none"

