[package]
name = "palisade-fileid"
description = "File identity for Palisade: PE parsing, hashing and signature metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# OS-backed reads on Windows (`palisade_fileid::win`, ADR 0003). Off by
# default. Intended for the agent, and the CLI for diagnostics; neither
# depends on this crate yet.
os-trust = ["dep:windows-sys"]
# Content tagging (`palisade_fileid::tags`, #44): the built-in tag set and
# organisation pattern rules. Off by default; the agent runs it off the
# identity hot path.
content-rules = ["dep:aho-corasick"]

[dependencies]
# The multi-pattern searcher for content tagging (#44), behind
# `content-rules`.
aho-corasick = { workspace = true, optional = true }
md-5 = { workspace = true }
# The shared verification-error table (#50, #58).
palisade-core = { workspace = true, features = ["serde"] }
# Bounded, streaming parsing of the RT_MANIFEST resource (#45). It never
# expands DTD entities.
quick-xml = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
# NFC for version-info name matching (#45).
unicode-normalization = { workspace = true }

# `O_NONBLOCK`, so opening a path that has become a FIFO cannot block.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The Windows API, for `palisade_fileid::win` only, so only with `os-trust`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# The fixture generator (`tests/corpus`): test CA keys and signatures.
rand_core = { workspace = true }
rsa = { workspace = true }
# Already dependencies above: tests/script.rs signs scripts with a key it
# generates (ring) and recomputes digests independently (sha2).
ring = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[[bench]]
name = "hash_and_parse"
harness = false
